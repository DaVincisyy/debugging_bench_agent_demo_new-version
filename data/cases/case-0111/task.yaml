question: |
  按仓库默认「标准测点定位流程」全量执行：根据 `user_measurement_question` 与原理图确定目标 TP，在位号图 PDF 检索、整页栅格、OpenCV 绿圈与后续 Part B-D（双 ROI / `case10_dual_roi_layout`）直至 `finish`，并产出规程所列全部 `debug/case10_*`、`step*`、`progress/*` 中间文件。
  
  **【本用例 Part B 强制：网格法 + 最近 IC】** 在写出 **`debug/case10_assembly_drawing_tp_marked.png`** 之后、**首次**为**离 TP 最近的 IC** 估 **`vlm_roi`** 之前：**必须** 用 **`run_python`** 复制该图并叠 **浅色稀疏网格**（推荐 **`grid_step_px=128`**，半透明浅灰线，勿盖住 TP 绿圈），**`cv2.imwrite` -> `debug/case10_assembly_drawing_tp_marked_grid.png`**（**W×H 与 `tp_marked` 完全一致**）。**估框用的 `view_image` 必须以带网格版为准**；写入 **`case10_assembly_vlm_hints.json`** 时附带 **`grid_step_px`** 与 **`vlm_visual_aid`**: `debug/case10_assembly_drawing_tp_marked_grid.png`。**StepB2 分割与 OpenCV 只准读无网格的 `case10_assembly_drawing_tp_marked.png`**，禁止用 `_grid` 图做阈值。**IC 选择策略**：选离 TP 绿圈**最近**的那个 IC 封装（不是整页最大），确保同一 IC 在实物图的同面也能看到。
