# Case 12（默认）：位号侧带绿圈 TP + 红框最大 IC；实物侧 **无红框** 整板照（如 PCBA_IMG.jpg）。
# VLM **同时看两图 + 读 locator graph**，把位号红框大芯片 **对应到** 实物上那颗芯片，只输出 **实物侧 ref_ic 中心** + 定全局比例 *s*（显式标量 **或** 两框宽高比）；Python 算 *t* 并 **一次** `s·p+t` 映射全部锚点。
# 备选（实物图带红框、全 OpenCV）：**`task_red_box_board.yaml`**。
