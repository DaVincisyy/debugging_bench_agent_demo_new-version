# inputs 路径相对本文件。完整规程由运行时的 compose_agent_question 从 data/skills/STANDARD_WORKFLOW.md 注入首轮 Task 文本（含 Part 0 硬约束）。
question: |
  按仓库默认「标准测点定位流程」全量执行：根据 `user_measurement_question` 与原理图确定目标 TP，在位号图 PDF 检索、整页栅格、OpenCV 绿圈与后续 Part B–C（至 **`step02_*` + `board_tp_marked`**）。**Part D 默认**：`case12_step02_opencv_ic_align`（`case12_step02_locator_graph` + OpenCV 双 IC 红框对齐 → `case12_board_approx_overlay_opencv.png` → Step8 → `finish`），见 **`STANDARD_WORKFLOW.md`**。若任务显式要写 **`mapping_method: case10_dual_roi_layout`**，可改走备用双 ROI Step3–8。须产出规程所列 **`debug/case10_*`**、**`step*`**、`progress/*`（progress 仍为可选笔记）。

  **【本用例 Part B 强制：网格法】** 在写出 **`debug/case10_assembly_drawing_tp_marked.png`** 之后、**首次**为最大 IC 估 **`vlm_roi`** 之前：**必须** 用 **`run_python`** 复制该图并叠 **浅色稀疏网格**（推荐 **`grid_step_px=128`**，半透明浅灰线，勿盖住 TP 绿圈），**`cv2.imwrite` → `debug/case10_assembly_drawing_tp_marked_grid.png`**（**W×H 与 `tp_marked` 完全一致**）。**估框用的 `view_image` 必须以带网格版为准**；写入 **`case10_assembly_vlm_hints.json`** 时附带 **`grid_step_px`** 与 **`vlm_visual_aid`**: `debug/case10_assembly_drawing_tp_marked_grid.png`。**StepB2 分割与 OpenCV 只准读无网格的 `case10_assembly_drawing_tp_marked.png`**，禁止用 `_grid` 图做阈值。

